<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0814">
<meta name="description" content="A Jackbox-style comedy D&D one-shot. One TV, up to six phones, an AI dungeon master with no filter.">
<title>Dummies & Dragons</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,3 93,27 93,73 50,97 7,73 7,27' fill='%23ff4fb8'/%3E%3Ctext x='50' y='64' font-size='38' text-anchor='middle' font-family='Georgia' font-weight='bold' fill='%231a0f24'%3E20%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/fonts/new-rocker-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"New Rocker";src:url(/fonts/new-rocker-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(/fonts/chakra-petch-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(/fonts/chakra-petch-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(/fonts/chakra-petch-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(/fonts/chakra-petch-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"VT323";src:url(/fonts/vt323-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
/* Layout: one-screen app. TV = header / stage + party rail. Phone = stacked controller with sticky action bar. */
:root{
  color-scheme: dark;
  --void:#0c0814; --crypt:#171024; --stone:#251b37; --seam:#3a2d52;
  --chrome:#ece9f6; --dim:#a69cc0; --hex:#ff4fb8; --mead:#ffcf5a;
  --ok:#7dffb0; --bad:#ff5d6c;
  --holo:linear-gradient(115deg,#7ff3ff 0%,#c9a7ff 30%,#ff9ad5 55%,#ffe58a 75%,#9dffcf 100%);
  --p1:#ff4fb8; --p2:#7ff3ff; --p3:#d8ff8a; --p4:#ffcf5a; --p5:#c9a7ff; --p6:#ff8a5c;
  --f-black:"New Rocker","Old English Text MT",Georgia,serif;
  --f-body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-mono:"VT323",ui-monospace,"Courier New",monospace;
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0c0814}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;font-synthesis:none;background:var(--void);color:var(--chrome);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(1200px 700px at 15% -10%,#3b1a5c 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#4a1238 0%,transparent 55%),radial-gradient(1px 1px at 20px 30px,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 120px 80px,#fff4 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70px 160px,#ffd6f080 50%,transparent 51%);
  background-size:auto,auto,190px 190px,240px 240px,310px 310px;background-attachment:fixed;overflow-x:hidden}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;opacity:.13;mix-blend-mode:overlay;image-rendering:pixelated}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%),repeating-linear-gradient(0deg,#0000 0 2px,#0000000f 2px 3px)}
#app{position:relative;z-index:1;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
h1,h2,h3{font-family:var(--f-black);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.chrome{padding-bottom:.18em;margin-bottom:-.18em;background:linear-gradient(180deg,#fff 0%,#e3e0ef 38%,#6b6382 50%,#d9d4ea 62%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #00000080) drop-shadow(0 0 18px #ff4fb855)}
.holo-text{background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.label{font-family:var(--f-mono);font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.panel{background:linear-gradient(var(--crypt),var(--crypt)) padding-box,var(--holo) border-box;border:2px solid transparent;border-radius:var(--r);box-shadow:0 10px 40px #0008,inset 0 1px 0 #ffffff14}
.slab{background:#ffffff08;border:1px solid var(--seam);border-radius:10px}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--f-mono);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;color:#1a0f24;padding:.55em 1.3em;border-radius:999px;
  background:linear-gradient(180deg,#fff9 0%,#fff0 48%) ,var(--holo);box-shadow:0 0 0 2px #0006,0 6px 0 #5b2a6e,0 10px 24px #ff4fb840;transition:transform .08s, filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px #0006,0 3px 0 #5b2a6e}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--chrome);box-shadow:inset 0 0 0 2px var(--seam)}
.btn.small{font-size:1.05rem;padding:.35em .9em}
.btn.big{font-size:2rem;padding:.5em 1.6em}
:focus-visible{outline:3px solid var(--mead);outline-offset:3px}
input,textarea,select{font:inherit;color:var(--chrome);background:#0006;border:2px solid var(--seam);border-radius:10px;padding:.65em .8em;width:100%;box-sizing:border-box}
input:focus,textarea:focus{border-color:var(--hex);outline:none;box-shadow:0 0 0 3px #ff4fb833}
textarea{resize:vertical;min-height:5.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:inherit;font-size:.95rem;color:var(--chrome);background:#ffffff0a;border:1.5px solid var(--seam);border-radius:999px;padding:.35em .85em}
.chip[aria-pressed="true"]{background:var(--holo);color:#1a0f24;border-color:transparent;font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--dim)}
.sparkle::before,.sparkle::after{content:"\2726";color:var(--mead);margin:0 .4em;font-size:.7em;vertical-align:middle}
.err{color:var(--bad)}

/* ---------- title / mode select ---------- */
.title-screen{max-width:760px;margin:4vh auto 0;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.logo{font-size:clamp(3.4rem,13vw,7.5rem);line-height:1.05}
.tagline{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.14em;color:var(--hex);text-transform:uppercase}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%}
.mode-grid .panel{padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left}
.mode-grid h2{font-size:2rem}

/* ---------- TV ---------- */
.tv{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:calc(100vh - 32px)}
.tv-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tv-head .logo{font-size:2.2rem}
.advtitle{font-family:var(--f-black);font-size:1.6rem;flex:1;min-width:0}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);background:var(--seam)}
.pip.done{background:var(--mead)} .pip.now{background:var(--hex);box-shadow:0 0 10px var(--hex)}
.codebox{font-family:var(--f-mono);font-size:1.3rem;padding:.2em .7em;border-radius:8px;border:1.5px solid var(--seam)}
.codebox b{font-size:1.6rem;color:var(--mead);letter-spacing:.2em}
.timer{font-family:var(--f-mono);font-size:2.2rem;min-width:3ch;text-align:right;color:var(--mead)}
.timer.hot{color:var(--bad);animation:throb .6s infinite}
@keyframes throb{50%{transform:scale(1.12)}}
.tv-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.tv-body.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.tv-body{grid-template-columns:minmax(0,1fr)}}
.stage{padding:26px clamp(18px,3vw,40px);min-height:60vh;display:flex;flex-direction:column;gap:20px}
.nar{font-size:clamp(1.15rem,1.7vw,1.55rem);line-height:1.55;max-width:62ch}
.nar p{margin:0 0 .8em}
.nar .caret{display:inline-block;width:.55em;height:1em;background:var(--hex);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.question{font-family:var(--f-black);font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.1}
.qwrap{border-top:1px dashed var(--seam);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.party{display:flex;flex-direction:column;gap:10px}
.pcard{padding:12px 14px;border-radius:12px;background:#ffffff08;border:1.5px solid var(--seam);border-left:6px solid var(--pc,var(--hex));display:flex;flex-direction:column;gap:4px}
.pcard .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.pcard .sub{font-size:.85rem;color:var(--dim)}
.hpbar{height:8px;border-radius:99px;background:#0008;overflow:hidden;border:1px solid #ffffff1a}
.hpbar i{display:block;height:100%;background:var(--hpc,var(--ok));transition:width .6s,background-color .6s;box-shadow:0 0 10px var(--hpc,var(--ok))}
.pcard.low{border-color:var(--bad);animation:lowpulse 1.4s ease-in-out infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 2px var(--bad),0 0 24px #ff5d6c80}}
.hpnum{font-family:var(--f-mono);font-size:1.15rem;color:var(--hpc,var(--ok))}
.myhp{padding:12px 14px;border-radius:14px;background:#ffffff0a;border:2px solid var(--hpc,var(--ok));display:flex;flex-direction:column;gap:8px}
.myhp .hpbar{height:16px}
.myhp .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.myhp .big{font-family:var(--f-mono);font-size:2rem;line-height:1;color:var(--hpc,var(--ok))}
.myhp.low{animation:lowpulse 1.4s ease-in-out infinite}
.myhp.down{border-color:var(--dim);filter:grayscale(.6)}
.npc{color:var(--mead);font-style:italic;padding-left:.9em;border-left:3px solid var(--mead)}
.npc b{font-style:normal;font-family:var(--f-mono);letter-spacing:.06em;font-size:.95em;color:var(--hex)}
.pcard.down{opacity:.55;filter:grayscale(.7)}
.tag{font-family:var(--f-mono);font-size:1rem;letter-spacing:.08em;padding:0 .45em;border-radius:6px;background:#ffffff14}
.tag.insp{background:var(--mead);color:#1a0f24}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.seat{padding:14px;border-radius:12px;border:2px dashed var(--seam);min-height:64px;display:flex;align-items:center;gap:10px;font-weight:600}
.seat.filled{border-style:solid;border-color:var(--pc);background:#ffffff08}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pc,var(--hex));flex:none;box-shadow:0 0 10px var(--pc,var(--hex))}
.bigcode{font-family:var(--f-mono);font-size:clamp(4rem,12vw,8rem);line-height:1;letter-spacing:.18em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt{padding:16px;border-radius:14px;background:#ffffff0a;border:2px solid var(--seam);display:flex;flex-direction:column;gap:8px;position:relative}
.opt .L{font-family:var(--f-black);font-size:2.2rem;line-height:1;color:var(--mead)}
.opt .t{font-size:1.15rem;font-weight:600}
.opt .by{font-size:.85rem;color:var(--dim)}
.opt.win{border-color:var(--mead);box-shadow:0 0 0 2px var(--mead),0 0 40px #ffcf5a55;transform:scale(1.02)}
.opt.lose{opacity:.4}
.ck{font-family:var(--f-mono);font-size:1.05rem;color:var(--hex)}
.votes{display:flex;gap:4px;min-height:14px}
.votes i{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.done-list{display:flex;flex-wrap:wrap;gap:8px}
.done-list span{padding:.25em .7em;border-radius:999px;border:1.5px solid var(--pc);font-size:.95rem}
.done-list span.in{background:var(--pc);color:#1a0f24;font-weight:700}
.words{display:flex;flex-wrap:wrap;gap:12px}
.word{padding:12px 16px;border-radius:12px;background:#ffffff0c;border:1.5px solid var(--seam);max-width:320px;animation:pop .5s backwards}
.word b{display:block;font-size:1.3rem}
.word small{color:var(--dim)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.foe{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:2px solid var(--bad);background:#ff5d6c12}
.foe h3{font-size:2rem}
.foe .hpbar{height:16px}
.foe .hpbar i{background:var(--bad)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{padding:16px;border-radius:14px;background:#ffffff0a;border:2px solid var(--pc);display:flex;flex-direction:column;gap:6px;animation:pop .5s backwards}
.ccard h3{font-size:1.7rem;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.stats div{background:#0006;border-radius:8px;padding:4px 0;line-height:1.1}
.stats b{display:block;font-size:1.05rem} .stats small{font-family:var(--f-mono);color:var(--dim);font-size:.95rem}
.controls{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:60}

/* d20 */
.d20wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px auto}
.d20{width:min(260px,60vw);aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center}
.d20 svg{position:absolute;inset:0;width:100%;height:100%}
.d20 .n{position:relative;font-family:var(--f-black);font-size:5.2rem;line-height:1;color:#1a0f24;text-shadow:0 1px 0 #fff8}
.d20.rolling svg{animation:spin .35s linear infinite}
.d20.idle svg{animation:bob 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.result{font-family:var(--f-black);font-size:clamp(2.2rem,5vw,3.6rem);text-align:center;line-height:1.05}
.result.success{color:var(--ok)} .result.fail{color:var(--bad)}
.result.crit{animation:rainbow 1.2s linear infinite;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%}
.result.fumble{color:var(--bad);animation:shake .4s 3}
@keyframes rainbow{to{background-position:200% 0}}
@keyframes shake{25%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}}
.math{font-family:var(--f-mono);font-size:1.6rem;text-align:center;color:var(--dim)}

/* thinking */
.think{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;min-height:52vh}
.orb{width:min(220px,50vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,#7ff3ff,#c9a7ff,#ff9ad5,#ffe58a,#9dffcf,#7ff3ff);filter:blur(1px) saturate(1.2);animation:spin 3s linear infinite;box-shadow:0 0 80px #ff4fb877,inset 0 0 40px #fff;position:relative}
.orb::after{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#2a1640 45%,#0c0814 100%)}
.think .line{font-family:var(--f-mono);font-size:1.7rem;letter-spacing:.08em;color:var(--mead);min-height:1.5em}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}

/* ---------- PHONE ---------- */
.phone{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:90px}
.phead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.phead .logo{font-size:1.7rem}
.me{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{padding:18px}
.ptitle{font-family:var(--f-black);font-size:2rem;line-height:1.05}
.pq{font-family:var(--f-black);font-size:1.6rem;line-height:1.15}
.optbtn{appearance:none;text-align:left;font:inherit;color:var(--chrome);cursor:pointer;padding:14px;border-radius:14px;background:#ffffff0a;border:2px solid var(--seam);display:flex;gap:12px;align-items:flex-start;width:100%}
.optbtn .L{font-family:var(--f-black);font-size:1.8rem;line-height:1;color:var(--mead)}
.optbtn[aria-pressed="true"]{border-color:var(--hex);background:#ff4fb81f;box-shadow:0 0 0 2px var(--hex)}
.optbtn small{display:block;color:var(--dim);margin-top:4px}
details.sheet{padding:12px 14px}
details.sheet summary{cursor:pointer;font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem}
.kv b{color:var(--mead)}
.classgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.classgrid .chip{border-radius:12px;text-align:left;padding:.5em .7em;display:flex;flex-direction:column;gap:2px}
.classgrid .chip small{font-size:.78rem;opacity:.8;font-weight:400}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#0c081400,#0c0814 35%);z-index:40;display:flex;justify-content:center}
.bar .btn{width:min(520px,100%)}
.waiting{font-family:var(--f-mono);font-size:1.5rem;color:var(--mead);text-align:center;letter-spacing:.06em}
.counter{font-family:var(--f-mono);color:var(--dim);text-align:right}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;padding:.5em 1em;border-radius:10px;background:var(--stone);border:1.5px solid var(--hex);font-family:var(--f-mono);font-size:1.2rem;max-width:90vw}
.qr{width:clamp(150px,18vw,230px);flex:none;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px var(--hex),0 0 30px #ff4fb855}.qr:empty{display:none}.qr svg{display:block;width:100%;height:auto}
.conn{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:.3em .9em;border-radius:999px;background:var(--bad);color:#1a0f24;font-family:var(--f-mono);font-size:1.1rem;letter-spacing:.08em}
</style>
</head>
<body>
<canvas id="grain" width="160" height="160" aria-hidden="true"></canvas>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="conn" class="conn" hidden role="status">Reconnecting&hellip;</div>

<script src="/qrcode.js"></script>
<script>
/* =========================================================
   DUMMIES & DRAGONS — host TV + phone controller, AI dungeon master
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const die = n => 1 + rnd(n);
const amod = s => Math.floor((s-10)/2);
const sgn = n => (n>=0?'+':'') + n;
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const clip = (s, n) => { s = String(s ?? '').replace(/[\u0000-\u0009\u000B-\u001F\u200B-\u200F\u2028-\u202E\u2060-\u206F]/g,'').trim(); return s.length > n ? s.slice(0, n-1).trimEnd() + '\u2026' : s; };
const uid = () => 'p' + Math.random().toString(36).slice(2,10);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

function sheet(ch){
  const c = CLASSES[ch.cl] || CLASSES.Fighter, r = RACES[ch.rc] || RACES.Human;
  const st = {}; ABIL.forEach(a => st[a] = (c.arr[a]||10) + (r.b[a]||0));
  const hp = c.hd + 2*(c.hd/2+1) + 3*amod(st.CON);
  return {st, hp: Math.max(8,hp), ac: c.ac, cls:c, prof:2};
}
function checkMod(ch, skill){
  const s = sheet(ch); const ab = SKILLS[skill] || (ABIL.includes(skill) ? skill : 'DEX');
  return amod(s.st[ab]) + (s.cls.sk.includes(skill) ? 2 : 0);
}
function atkMod(ch){ const s = sheet(ch); return amod(s.st[s.cls.atk]) + 2; }

(function grain(){
  const c = $('#grain'), x = c.getContext('2d'); const img = x.createImageData(160,160);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){ const d=img.data; for(let i=0;i<d.length;i+=4){ const v=rnd(255); d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } x.putImageData(img,0,0); }
  frame(); if(!still) setInterval(frame, 90);
})();

/* ---------------- AUDIO (procedural, starts on a click) ---------------- */
const Sound = (() => {
  let ctx, master, mus, sfx, dl, mode = 'off', timer, nextT = 0, step = 0;
  let muted = !!store.get('rfs-mute');
  const hz = m => 440*Math.pow(2,(m-69)/12);
  function init(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch { return; }
    master = ctx.createGain(); master.gain.value = muted ? 0 : .75; master.connect(ctx.destination);
    dl = ctx.createDelay(); dl.delayTime.value = .27; const fb = ctx.createGain(); fb.gain.value = .3; const wet = ctx.createGain(); wet.gain.value = .3;
    dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
    mus = ctx.createGain(); mus.gain.value = .5; mus.connect(master); mus.connect(dl);
    sfx = ctx.createGain(); sfx.gain.value = .8; sfx.connect(master); sfx.connect(dl);
  }
  function tone(t,f,dur,type,vol,dest,att=.005){ const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(dest||mus); o.start(t); o.stop(t+dur+.05); return o; }
  function pluck(t,f,vol=.15){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(3000,t); fl.frequency.exponentialRampToValueAtTime(380,t+.35); const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.85); o.connect(fl); fl.connect(g); g.connect(mus); o.start(t); o.stop(t+.9); }
  function noise(t,dur,vol,freq=1500,q=1,dest){ const len=Math.max(1,Math.ceil(ctx.sampleRate*dur)); const b=ctx.createBuffer(1,len,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q; const g=ctx.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(dest||sfx); s.start(t); }
  function kick(t,vol=.5){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.22); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(mus); o.start(t); o.stop(t+.32); }
  const TAV = [[50,57,62,65,69,65,62,57],[48,55,60,64,67,64,60,55],[46,53,58,62,65,62,58,53],[45,52,57,61,64,61,57,52]];
  const THINK = [38,38,45,38,41,38,44,43];
  const BATTLE = [[38,50,38,50,41,53,40,52],[36,48,36,48,38,50,40,52]];
  function schedule(){
    if (!ctx) return; const now = ctx.currentTime;
    if (nextT < now) nextT = now + .02;
    while (nextT < now + .3) {
      const t = nextT;
      if (mode === 'tavern') {
        const bar = Math.floor(step/8)%4, n = step%8, ns = TAV[bar];
        pluck(t, hz(ns[n]), n===0 ? .17 : .1);
        if (n===0) tone(t, hz(ns[0]-12), 2.4, 'triangle', .08);
        if (n%2===0) noise(t,.04,.035,7000,.8,mus);
        if (n===5 && Math.random()<.35) tone(t, hz(ns[0]+24+pick([0,3,7,10])), .7, 'sine', .045);
        nextT += 60/100/2;
      } else if (mode === 'think') {
        const n = step%8;
        tone(t, hz(THINK[n]), .2, 'square', .045);
        if (n%2===0) kick(t,.45);
        if (n===0) tone(t, hz(THINK[0]+24+(Math.floor(step/8)%2?3:0)), 1.3, 'sawtooth', .025, mus, .3);
        noise(t,.03,.03,9000,1,mus);
        nextT += 60/118/2;
      } else if (mode === 'battle') {
        const bar = Math.floor(step/8)%2, n = step%8;
        tone(t, hz(BATTLE[bar][n]), .14, 'square', .05);
        if (n%4===0) kick(t,.6); if (n%4===2) noise(t,.12,.18,1800,.7,mus);
        if (n===0) tone(t, hz(BATTLE[bar][0]+24), .9, 'sawtooth', .03, mus, .02);
        nextT += 60/150/2;
      } else { nextT = now + .3; return; }
      step++;
    }
  }
  function music(m){ init(); if (!ctx || m === mode) return; mode = m; step = 0; nextT = ctx.currentTime + .05; if (!timer) timer = setInterval(schedule, 70); }
  function fx(name){
    init(); if (!ctx) return; const t = ctx.currentTime + .01;
    if (name==='dice'){ for(let i=0;i<9;i++) noise(t+i*.07+Math.random()*.03,.03,.5,2500+rnd(2500),3); }
    else if (name==='ding'){ tone(t,hz(84),.5,'sine',.25,sfx); tone(t+.06,hz(91),.6,'sine',.18,sfx); }
    else if (name==='pop'){ tone(t,hz(72),.15,'square',.12,sfx); tone(t+.05,hz(79),.2,'square',.1,sfx); }
    else if (name==='good'){ [62,66,69,74].forEach((m,i)=>tone(t+i*.08,hz(m),.5,'square',.08,sfx)); }
    else if (name==='bad'){ [58,55,51].forEach((m,i)=>tone(t+i*.16,hz(m),.4,'sawtooth',.08,sfx)); }
    else if (name==='crit'){ [62,66,69,74,78,81,86].forEach((m,i)=>tone(t+i*.07,hz(m),.7,'square',.08,sfx)); tone(t+.5,hz(50),1.6,'sawtooth',.08,sfx,.05); }
    else if (name==='fumble'){ const o=tone(t,hz(55),1.6,'sawtooth',.12,sfx); o.frequency.setValueAtTime(hz(55),t); [0,.35,.7].forEach((d,i)=>{o.frequency.linearRampToValueAtTime(hz(55-i),t+d+.05);o.frequency.linearRampToValueAtTime(hz(54-i),t+d+.3);}); o.frequency.linearRampToValueAtTime(hz(46),t+1.5); }
    else if (name==='gong'){ tone(t,hz(40),3,'sine',.4,sfx,.01); tone(t,hz(52.3),2.5,'triangle',.15,sfx,.01); noise(t,.6,.15,300,.5); }
  }
  function toggle(){ init(); muted = !muted; store.set('rfs-mute', muted); if (master) master.gain.value = muted ? 0 : .75; return muted; }
  function duck(d){ if (!ctx || !mus) return; mus.gain.setTargetAtTime(d ? .14 : .5, ctx.currentTime, .25); }
  return { init, music, fx, toggle, duck, get muted(){ return muted; } };
})();

/* ---------------- VOICES (browser text-to-speech: narrator + NPC voices) ---------------- */
const Voice = (() => {
  const ss = window.speechSynthesis;
  let voices = [], narr = null, on = store.get('rfs-voice') !== false, primed = false, gen = 0;
  // pitch, rate per NPC voice style the DM assigns
  const STYLE = {deep:[.5,.9], gravelly:[.6,.86], booming:[.7,.9], high:[1.45,1.08], squeaky:[1.9,1.22], posh:[1.08,.94], old:[.78,.78],
    sinister:[.62,.82], nasal:[1.3,1.06], sultry:[.85,.84], child:[1.75,1.12], monster:[.3,.8], drunk:[.9,.78], cheerful:[1.25,1.1]};
  const score = v => (/natural|neural|premium|enhanced/i.test(v.name) ? 6 : 0) + (/Google UK English Male|Daniel|Arthur|Ryan|Guy|Christopher|Brian|Andrew|Oliver|George|Thomas|Rishi/i.test(v.name) ? 4 : 0) + (/en-GB/i.test(v.lang) ? 1 : 0) + (v.localService === false ? 1 : 0);
  function load(){
    if (!ss) return;
    voices = ss.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang) && !/(Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert)/i.test(v.name));
    narr = voices.slice().sort((a,b) => score(b) - score(a))[0] || null;
  }
  if (ss) { load(); ss.addEventListener?.('voiceschanged', load); }
  const hash = s => { let h = 7; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
  function npcVoice(name, style){
    const pool = voices.filter(v => v !== narr), v = pool.length ? pool[hash(name) % pool.length] : narr;
    const st = STYLE[String(style||'').toLowerCase()];
    return {v, p: st ? st[0] : .75 + (hash(name) % 8)/10, r: st ? st[1] : .9 + (hash(name+'r') % 3)/10};
  }
  // browser voices spell out ALL-CAPS words letter by letter ("O-W-W"), so say shouted words as normal words
  const KEEP_CAPS = new Set(['DM','NPC','HP','AC','DC','XP','OK','TV','D&D','II','III','IV']);
  const clean = t => String(t).replace(/[*_#~`]/g, '')
    .replace(/\b[A-Z][A-Z'\u2019-]+\b/g, w => KEEP_CAPS.has(w) ? w : w.charAt(0) + w.slice(1).toLowerCase())
    .replace(/([a-z])\1{3,}/g, '$1$1$1')
    .replace(/([!?])[!?]+/g, '$1')
    .replace(/\s+/g, ' ').trim();
  const chunks = t => (clean(t).match(/[^.!?…]+[.!?…]+["”')]*|[^.!?…]+$/g) || []).map(x => x.trim()).filter(Boolean);
  const ok = () => !!ss && voices.length > 0;
  function say(lines, cast = {}){
    if (!on || !ok()) return;
    const mine = ++gen; ss.cancel();
    const items = [];
    lines.filter(Boolean).forEach(line => {
      const n = isNpc(line) && npcSplit(line);
      if (n) { const vv = npcVoice(n.who, cast[n.who]); chunks(n.say).forEach(t => items.push({t, ...vv})); }
      else chunks(line).forEach(t => items.push({t, v: narr, p: .9, r: 1}));
    });
    if (!items.length) return;
    setTimeout(() => {           // Chrome drops utterances queued in the same tick as cancel()
      if (mine !== gen) return;
      Sound.duck(true);
      items.forEach((it, i) => {
        const u = new SpeechSynthesisUtterance(it.t);
        if (it.v) { u.voice = it.v; u.lang = it.v.lang; }
        u.pitch = clamp(it.p, 0, 2); u.rate = clamp(it.r, .5, 2);
        if (i === items.length - 1) u.onend = u.onerror = () => { if (mine === gen) Sound.duck(false); };
        ss.speak(u);
      });
    }, 80);
  }
  function stop(){ gen++; if (ss) ss.cancel(); Sound.duck(false); }
  // rough seconds of speech, used to give players extra time while the DM talks
  function estimate(lines){ if (!on || !ok()) return 0; const words = lines.join(' ').split(/\s+/).filter(Boolean).length; return Math.ceil(words / 2.5) + 2; }
  function prime(){ if (primed || !ss) return; primed = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch {} }
  function toggle(){ on = !on; store.set('rfs-voice', on); if (!on) stop(); return on; }
  function sample(){
    say(['Welcome, dummies. I am your dungeon master, and I have already decided most of you will die.',
         'Grumbo the Barkeep: "Oi! Wipe your boots before you bleed on my floor."',
         'Lady Gristle: "Darling, is that a goblin or your husband?"'], {'Grumbo the Barkeep':'gravelly', 'Lady Gristle':'posh'});
  }
  document.addEventListener('pointerdown', prime, {capture:true});
  return { say, stop, estimate, toggle, sample, get on(){ return on; }, get ok(){ return ok(); } };
})();

/* ---------------- NETWORK (WebSocket room relay + AI DM endpoint) ---------------- */
let NR = null, SERVER = {password:false};
const capsReady = fetch('/api/health').then(r => r.json()).then(j => { SERVER = j; }).catch(() => {});
const Net = {
  // Join a room by code. Resolves an object with presence(), onPeers(), leave(), connected().
  join(code, hostKey){
    return new Promise((resolve, reject) => {
      let ws, mine = {}, handlers = [], errHandlers = [], open = false, closed = false, first = true, retry = 0, connTimer;
      const conn = $('#conn');
      const api = {
        presence(patch){ for (const [k,v] of Object.entries(patch)) { if (v === null) delete mine[k]; else mine[k] = v; } if (open) ws.send(JSON.stringify({t:'presence', patch})); return Promise.resolve(); },
        onPeers(fn, onErr){ handlers.push(fn); if (onErr) errHandlers.push(onErr); return () => { handlers = handlers.filter(h => h !== fn); }; },
        leave(){ closed = true; try { ws.close(); } catch {} return Promise.resolve(); },
        connected: () => open
      };
      function connect(){
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);
        ws.onopen = () => ws.send(JSON.stringify({t:'join', code, hostKey, presence: mine}));
        ws.onmessage = ev => {
          let m; try { m = JSON.parse(ev.data); } catch { return; }
          if (m.t === 'joined') { open = true; retry = 0; clearTimeout(connTimer); conn.hidden = true; if (first) { first = false; resolve(api); } }
          else if (m.t === 'peers') handlers.forEach(h => h({peers: m.peers}));
          else if (m.t === 'error') { if (first) { first = false; closed = true; ws.close(); reject({code: m.error}); } else { closed = true; errHandlers.forEach(h => h({code:m.error})); } }
        };
        ws.onclose = () => {
          open = false; if (closed) return;
          connTimer = setTimeout(() => { conn.hidden = false; }, 1500);
          setTimeout(connect, Math.min(8000, 500 * 2 ** retry++));
        };
      }
      // resend presence when a phone wakes up
      document.addEventListener('visibilitychange', () => { if (!document.hidden && !open && !closed && ws?.readyState > 1) connect(); });
      connect();
      setTimeout(() => { if (first) { first = false; reject({code:'timeout'}); } }, 15000);

async function postJSON(url, body){
  const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code: j.error || 'upstream_error', status: r.status};
  return j;
}

function qrSVG(text){
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();

}

/* =========================================================
   HOST (the TV) — owns the game state and calls the AI DM
   ========================================================= */
const Host = (() => {
  let S, G, code, lastPid = -1, busy = false, retryFn = null, typeTimer = null, thinkTimer = null, lastSeen = {};

  function fresh(){
    return { v:1, code, ph:'lobby', pid:0, end:0, seats:[], party:{}, ttl:'', scene:0, n:LENGTHS.standard.n,
      nar:[], q:'', opts:[], vc:[], win:-1, roller:'', ck:null, roll:null, foe:null, fw:[], ml:{}, sub:[], intros:[], awards:[], clash:[], msg:'', err:'' };
  }
  function freshG(){ return { players:{}, bank:[], log:[], fwId:null, len:'standard', brain:'clever', stats:{}, round:0, fightKind:null, combatTurns:[] }; }

  let hostKey = '';
  async function start(saved){
    const password = $('#hpw')?.value || '';
    $('#app').innerHTML = `<div class="think"><div class="orb"></div><div class="line">Setting up the table</div></div>`;
    const fail = (title, msg) => { $('#app').innerHTML = `<div class="title-screen"><h2 class="chrome" style="font-size:3rem">${esc(title)}</h2><p class="muted">${esc(msg)}</p><button class="btn" id="backBtn">Back</button></div>`; $('#backBtn').onclick = titleScreen; };
    let room;
    try { room = await postJSON('/api/room', {password, code: saved?.code, hostKey: saved?.hostKey}); }
    catch (e) {
      if (e.code === 'wrong_password') { store.del('rfs-pw'); return fail('Wrong password', 'Ask whoever set up the site for the host password.'); }
      if (e.code === 'too_many_rooms') return fail('Slow down', 'This network has opened a lot of tables today. Try again tomorrow.');
      return fail("Couldn't reach the server", 'Check your connection and try again. If the site was asleep, give it 30 seconds to wake up.');
    }
    if (password) store.set('rfs-pw', password);
    code = room.code; hostKey = room.hostKey; window.__code = code;
    S = saved?.S || fresh(); G = saved?.G || freshG(); S.code = code;
    try { NR = await Net.join(code, hostKey); }
    catch (e) { return fail("Couldn't open a table", 'Try again in a moment.'); }
    NR.onPeers(onPeers);
    if (busy === false && S.ph === 'think') { S.err = 'The game was interrupted mid-thought.'; retryFn = null; }
    pub(); render(true);
    setInterval(tick, 400);
    Sound.music(S.ph==='combat'||S.ph==='clash' ? 'battle' : 'tavern');
  }

  /* ----- networking ----- */
  function pub(){
    let s = JSON.parse(JSON.stringify(S));
    let bytes = new Blob([JSON.stringify(s)]).size;
    while (bytes > 30000 && s.nar.length) { const last = s.nar[s.nar.length-1]; if (last.length > 200) s.nar[s.nar.length-1] = last.slice(0, last.length-200)+'…'; else s.nar.pop(); bytes = new Blob([JSON.stringify(s)]).size; }
    NR?.presence({h:1, s}).catch(()=>{});
    store.set('rfs-host', {code, hostKey, S, G, ts:Date.now()});
  }
  function onPeers({peers}){
    let changed = false;
    for (const p of peers){
      const pr = p.presence || {};
      if (!pr.p || typeof pr.id !== 'string' || !/^p[a-z0-9]{4,12}$/.test(pr.id)) continue;
      const prev = G.players[pr.id];
      const nm = clip(pr.nm, 16) || 'Someone';
      const ch = pr.ch && CLASSES[pr.ch.cl] && RACES[pr.ch.rc] ? {nm:clip(pr.ch.nm,28)||nm, rc:pr.ch.rc, cl:pr.ch.cl, lk:clip(pr.ch.lk,200)} : (prev?.ch || null);
      G.players[pr.id] = {nm, ch, ml: Array.isArray(pr.ml) ? pr.ml.slice(0,3).map(a=>clip(a,60)) : (prev?.ml||[]), inp: pr.inp && typeof pr.inp === 'object' ? pr.inp : null, draft: pr.draft && typeof pr.draft === 'object' ? {pid: pr.draft.pid, v: clip(pr.draft.v, 200)} : null};
      if (!prev) changed = true;
      lastSeen[pr.id] = Date.now();
      if (S.ph === 'lobby' && !S.seats.find(s=>s.id===pr.id) && S.seats.length < 6){ S.seats.push({id:pr.id, n:nm}); Sound.fx('pop'); changed = true; }
      const seat = S.seats.find(s=>s.id===pr.id); if (seat && seat.n !== nm){ seat.n = nm; changed = true; }

  /* ----- phase helpers ----- */
  function seated(){ return S.seats; }

    if (S.end && ['pitch','combat','party'].includes(ph)) S.end += Voice.estimate(spoken()) * 1000;

    if (ph === 'chargen') return endChargen();
    if (ph === 'framework') return endFramework();
    if (ph === 'party') return setPhase('pitch', PITCH_SECS);
    if (ph === 'pitch') return endPitch();
    if (ph === 'vote') return endVote();
    if (ph === 'roll') return endRoll();
    if (ph === 'combat') return endCombat();
  }

  function startGame(){
    if (!S.seats.length) return toast('Nobody has joined yet');
    S.n = LENGTHS[G.len].n;
    S.seats.forEach((s,i) => { G.stats[s.id] = G.stats[s.id] || {n20:0,n1:0,wins:0}; });
    const pool = shuffle(PROMPTS.map((_,i)=>i)); S.ml = {};
    S.seats.forEach((s,i) => S.ml[s.id] = pool.slice(i*3, i*3+3));
    Sound.fx('gong');
    setPhase('madlibs', 120);
  }
  function endMadlibs(){
    G.bank = [];
    S.seats.forEach(s => { const pl = P(s.id); (S.ml[s.id]||[]).forEach((pi, j) => { const a = clip(pl.ml?.[j], 60); if (a) G.bank.push({q:PROMPTS[pi], a, by:s.n}); }); });
    if (!G.bank.length) G.bank = [{q:'A horrible name for a tavern', a:'The Soggy Flagon', by:'the DM'}, {q:'The sexiest masculine name', a:'Brock Thunderloins', by:'the DM'}];
    setPhase('reveal', Math.min(30, 6 + G.bank.length*1.2));
  }
  function endChargen(){
    // anyone without a locked character gets a random one
    S.seats.forEach(s => { const pl = G.players[s.id] || (G.players[s.id] = {nm:s.n}); if (!pl.ch) pl.ch = randomChar(s.n); const sh = sheet(pl.ch); S.party[s.id] = {hp:sh.hp, mx:sh.hp, insp:0, dn:0}; });

  }
  function endFramework(){

    S.seats.forEach(s => { const i = inp(s.id,'fw'); if (i && counts[i.v] !== undefined) counts[i.v]++; });
    const max = Math.max(...Object.values(counts)); G.fwId = pick(S.fw.filter(id => counts[id] === max));

  }

    // grab pitches now: once the phase changes, submissions from this phase no longer match
    G.pitches = S.seats.map(s => {
      const sub = inp(s.id,'pitch')?.v, d = P(s.id).draft;
      const draft = d && d.pid === S.pid ? d.v : '';

  }
  function endVote(){
    const vc = S.opts.map(() => 0); S.seats.forEach(s => { const i = inp(s.id,'vote'); if (i && Number.isInteger(i.v) && i.v >= 0 && i.v < vc.length) vc[i.v]++; });
    const max = Math.max(...vc); const win = pick(vc.map((c,i)=>c===max?i:-1).filter(i=>i>=0));
    const o = S.opts[win]; let roller = o.by && S.seats.find(s=>s.id===o.by) && !S.party[o.by]?.dn ? o.by : null;

  }
  function endRoll(){
    const id = S.roller, i = inp(id,'roll'), ch = P(id).ch || randomChar('x');
    let dice = i && Array.isArray(i.d) ? i.d.map(n=>clamp(parseInt(n)||1,1,20)).slice(0,2) : [die(20)];
    let adv = false;
    if (dice.length === 2 && S.party[id]?.insp > 0) { adv = true; S.party[id].insp--; } else dice = [dice[0]];
    const d = Math.max(...dice), m = checkMod(ch, S.ck.sk), tot = d + m;
    const res = d === 20 ? 'crit' : d === 1 ? 'fumble' : tot >= S.ck.dc ? 'success' : 'fail';

    setTimeout(() => Sound.fx(res==='crit'?'crit':res==='fumble'?'fumble':res==='success'?'good':'bad'), 1500);

  }
  function endCombat(){
    const foe = S.foe, turns = [];
    S.seats.forEach(s => {
      const pt = S.party[s.id], ch = P(s.id).ch || randomChar('x'), i = inp(s.id,'cbt');
      if (pt.dn) {
        const d = i && Array.isArray(i.d) ? clamp(parseInt(i.d[0])||1,1,20) : die(20);
        const up = d >= 10; if (up) { pt.dn = 0; pt.hp = d === 20 ? 5 : 1; }

      }
      if (!i) { turns.push({id:s.id, idle:true}); return; }
      let dice = Array.isArray(i.d) ? i.d.map(n=>clamp(parseInt(n)||1,1,20)).slice(0,2) : [die(20)];
      let adv = false; if (dice.length===2 && pt.insp>0){ adv = true; pt.insp--; } else dice = [dice[0]];

    setTimeout(() => runAI(foe.hp <= 0 ? 'Writing a death scene' : 'The enemy strikes back', aiCombat), 4500);
  }

  /* ----- AI DM ----- */
  function fw(){ return FRAMEWORKS.find(f => f.id === G.fwId) || FRAMEWORKS[0]; }
  function act(){ return S.scene <= Math.ceil(S.n/3) ? 1 : S.scene <= Math.ceil(2*S.n/3) ? 2 : 3; }
  const RULES = `You are the Dungeon Master and every NPC for DUMMIES & DRAGONS, a Jackbox-style party game: a comedy D&D 5e one-shot played by up to 6 friends on their phones. Your narration is shown on a TV and read aloud.
Tone: crude, profane, absurd, R-rated comedy. Swearing, gross-out humor, innuendo and roasting the player characters are all welcome. No explicit sex, no slurs, nothing about real people.
Style: punchy and fast. Short paragraphs, vivid specifics, NPCs with funny voices quoted in dialogue. Address the party as "you" and use character names. Never decide what a player character says or does beyond the action they chose.
Rules: real D&D 5e logic. Ability checks use the 18 5e skills. DCs: easy 10, medium 13, hard 16, very hard 19. A natural 20 is a legendary success; a natural 1 is a humiliating disaster.
Dialogue: give NPCs real lines of dialogue. Put every line an NPC speaks in its own paragraph, exactly like this: Grumbo the Barkeep: "Wipe your boots, you animals." Keep each NPC's name short and identical every time they talk. Narration paragraphs must not contain dialogue. Never write dialogue for the player characters.
Voices: every reply that has narration also includes "cast": an object giving each NPC who speaks in it a voice, e.g. {"Grumbo the Barkeep":"gravelly"}. Voices: deep, gravelly, booming, high, squeaky, posh, old, sinister, nasal, sultry, child, monster, drunk, cheerful. Keep an NPC's voice the same all game. Use {} when no NPC speaks.

  function context(){
    const f = fw();

    const bank = G.bank.map(b => `- "${b.a}" (answer to "${b.q}", from ${b.by})`).join('\n');
    return `${RULES}

ADVENTURE: ${f.name}. ${f.pitch}
ACT 1: ${f.acts[0]}. ACT 2: ${f.acts[1]}. ACT 3: ${f.acts[2]}. FINAL BOSS: ${f.boss}.
NOW: act ${act()} of 3, scene ${S.scene} of ${S.n}. Keep the pacing on track for that.

WORD BANK. The players' own madlib answers. Use them verbatim as names of NPCs, places, items, foods, curses and catchphrases. Weave 1-3 into each narration, favor ones not used yet, and make them land as jokes:
${bank}

PARTY:
${party}

NPC VOICES ALREADY CAST (reuse these names and voices): ${Object.keys(G.cast||{}).length ? Object.entries(G.cast).map(([k,v])=>k+' = '+v).join('; ') : '(none yet)'}

STORY SO FAR:
${G.log.length ? G.log.map((l,i)=>`${i+1}. ${l}`).join('\n') : '(just starting)'}`;
  }
  function narArr(t){ return String(t||'').split(/\n\s*\n|\n/).map(p=>clip(p,700)).filter(Boolean).slice(0,9); }
  function castMerge(c){ if (!c || typeof c !== 'object') return; G.cast = G.cast || {}; for (const [k,v] of Object.entries(c).slice(0,12)) { const n = clip(k,41); if (n && !G.cast[n]) G.cast[n] = clip(v,20); } }
  function applyHp(list){
    if (!Array.isArray(list)) return;
    list.forEach(h => { const pt = S.party[h?.id]; if (!pt) return; const c = clamp(parseInt(h.change)||0, -12, 10); pt.hp = clamp(pt.hp + c, 0, pt.mx); if (pt.hp <= 0) { pt.hp = 0; pt.dn = 1; } else if (c > 0) pt.dn = 0; });

  async function ask(prompt, quick){
    const j = await postJSON('/api/dm', {code, hostKey, prompt, fast: !!(quick || G.brain === 'fast')});
    if (!j.data || typeof j.data !== 'object') throw {code:'invalid_json'};
    return j.data;
  }
  async function runAI(msg, fn){
    if (busy) return;
    G.pending = {aiIntro:'intro', aiOptions:'options', aiResolve:'resolve', aiCombat:'combat'}[fn.name] || 'resolve';
    busy = true; retryFn = () => runAI(msg, fn);
    setPhase('think', 0, {msg}); Sound.music('think');
    try {
      try { await fn(); }
      catch (e) {
        if (['bad_key','no_credit','room_limit','not_host','wrong_password'].includes(e?.code)) throw e;
        console.warn('DM hiccup, retrying once', e);
        await new Promise(r => setTimeout(r, 2500));
        await fn();
      }
      busy = false;
    } catch (e) {
      busy = false; console.warn(e);
      const why = {
        rate_limited:'The DM is getting too many requests. Wait a minute, then retry.',
        overloaded:'The AI is overloaded right now. Wait a few seconds, then retry.',
        invalid_json:'The DM mumbled. Retry.',
        room_limit:'This table has used up its DM calls for the night. Start a new game, or skip ahead without the DM.',
        bad_key:'The site’s Anthropic API key is wrong or missing. Whoever set up the site needs to fix it.',
        no_credit:'The site’s Anthropic account is out of credit. Add credit in the Anthropic Console, then retry.',
        not_host:'This screen lost its host pass (the server may have restarted). Open a new table.'
      }[e?.code] || 'The DM tripped over the table. Retry.';
      S.err = why + (e?.code ? ` (${e.code})` : ''); pub(); render(true);
    }
  }
  async function aiIntro(){

- "narration": the opening scene, 120-170 words, 2-3 paragraphs separated by blank lines. Set up Act 1 and the hook. Use at least two word-bank answers.
- "question": what you ask the party next, max 16 words, ending with "?".
- "recap": what happened, max 25 words.
JSON: {"title":"","intros":[{"id":"","line":""}],"narration":"","question":"","recap":""}`);
    S.ttl = clip(r.title, 60) || fw().name;
    S.intros = (Array.isArray(r.intros) ? r.intros : []).filter(x => S.party[x?.id]).map(x => ({id:x.id, l:clip(x.line, 220)}));

THE SCENE: ${S.nar.join(' ')}
QUESTION TO THE PARTY: ${S.q}

THE PLAYERS' PITCHES:
${pitches.length ? pitches.map(p=>`- from id ${p.id} (${cname(p.id)}): ${p.t}`).join('\n') : '(nobody pitched anything, cowards)'}

TASK: Turn ${k ? `the pitches into ${k} options` : 'nothing into 3 options of your own'} for the party to vote on${k ? ', plus 1 extra WILDCARD option of your own (by: null) that is chaotic and tempting' : ''}. Keep each pitch's idea and its funniest detail and punch it up: max 22 words, phrased as an action. Merge near-duplicates and credit the first pitcher. Pick the single 5e skill each attempt uses and a fair DC.

  async function aiResolve(){
    const o = S.opts[S.win], rl = S.roll, ch = P(rl.id).ch;
    const mid = Math.max(2, Math.round(S.n/2)), next = S.scene + 1;
    let kind = 'scene';
    if (next === mid) kind = 'fight'; else if (S.scene >= S.n) kind = 'boss';
    const f = fw();
    const nextInstr = kind === 'scene'
      ? `then move the story forward into a new situation (act ${next <= Math.ceil(S.n/3) ? 1 : next <= Math.ceil(2*S.n/3) ? 2 : 3}) and end with a new "question" for the party, max 16 words, ending with "?".`
      : kind === 'fight'
      ? `then a fight breaks out: introduce a ridiculous enemy that fits the story (name it from the word bank if one fits). Give "foe": {"name": max 5 words, "hp": a number from 24 to 36, "ac": 12 to 14}. "question": a battle prompt like "How do you open this fight?".`
      : `then the final showdown begins: ${f.boss} appears in all its glory (rename it with a word-bank answer if one fits). Give "foe": {"name": max 5 words, "hp": a number from 45 to 62, "ac": 15}. "question": a battle prompt.`;
    const r = await ask(`${context()}

THE SCENE: ${S.nar.join(' ')}
THE PARTY CHOSE: "${o.t}". Attempted by ${cname(rl.id)} (${ch?.rc} ${ch?.cl}).
CHECK: ${o.sk} DC ${o.dc}. They rolled a natural ${rl.d}${rl.adv?' (with advantage)':''}, ${sgn(rl.m)} = ${rl.tot}. RESULT: ${resultText(rl.res).toUpperCase()}.

TASK: Narrate the outcome, 100-160 words, 2-3 paragraphs separated by blank lines. Open with the roll's outcome and make it land; ${nextInstr}
Also "hp": any hit point changes this caused, as [{"id":"","change":-3}] (damage -1 to -8, healing +1 to +8; usually none on a success). "inspiration": the id of at most one player whose idea or play was funniest, or null. "recap": max 25 words.
JSON: {"narration":"","question":"","hp":[],"inspiration":null,"recap":""${kind!=='scene'?',"foe":{"name":"","hp":30,"ac":13}':''}}`);
    S.nar = narArr(r.narration); castMerge(r.cast); S.q = clip(r.question, 140) || 'What now?';
    applyHp(r.hp);
    if (r.inspiration && S.party[r.inspiration]) S.party[r.inspiration].insp = Math.min(2, S.party[r.inspiration].insp + 1);
    G.log.push(clip(r.recap, 200));
    if (S.seats.every(s => S.party[s.id].dn)) return finale('tpk');
    S.scene = next;
    if (kind === 'scene') { Sound.music('tavern'); return setPhase('pitch', PITCH_SECS, {foe:null}); }
    const fo = r.foe || {};
    const boss = kind === 'boss';
    // enemy HP scales with party size so a solo hero and a table of six both get a fair fight
    const np = S.seats.length;
    const hp = boss ? 16 + 13*np + rnd(8) : 8 + 8*np + rnd(6);
    S.foe = {n: clip(fo.name, 40) || (boss ? 'The Big Bad' : 'Angry Something'), hp: Math.max(12,hp), mx: Math.max(12,hp), ac: clamp(parseInt(fo.ac)||(boss?15:13), 10, 17), boss: boss?1:0};
    G.round = 0; Sound.music('battle'); Sound.fx('gong');
    setPhase('combat', 75);
  }
  async function aiCombat(){
    const foe = S.foe, turns = G.combatTurns;
    const lines = turns.map(t => {
      const nm = cname(t.id), cl = P(t.id).ch?.cl;
      if (t.save) return `- ${nm} is downed and rolls a death save: natural ${t.d}. ${t.up ? 'They get back up!' : 'Still down.'}`;
      if (t.idle) return `- ${nm} (${cl}) froze up and did nothing.`;
      return `- ${nm} (${cl}): "${t.t}" rolled natural ${t.d}, total ${t.tot} vs AC ${foe.ac}: ${t.hit ? `HIT for ${t.dmg} damage${t.crit?' (CRITICAL!)':''}` : t.d===1 ? 'FUMBLE' : 'MISS'}.`;
    }).join('\n');
    const dead = foe.hp <= 0, flee = !dead && !foe.boss && G.round >= 5;
    const tpk = S.seats.every(s => S.party[s.id].dn);
    let task, shape;
    if (dead && foe.boss) {
      task = `Narrate this final round with a spectacular, disgusting finishing blow from whoever hit last, then an epilogue: what becomes of everyone and each hero, 180-240 words total, 3-4 paragraphs separated by blank lines. Then "awards": one per party member [{"id":"","title": a funny award name, max 5 words, "why": max 18 words}].`;
      shape = `{"narration":"","awards":[{"id":"","title":"","why":""}],"recap":""}`;
    } else if (dead || flee) {
      task = `Narrate this round, 110-160 words, 2-3 paragraphs separated by blank lines. ${dead ? 'Include a spectacular, disgusting finishing blow from whoever hit last.' : 'The foe, beaten and humiliated, flees or surrenders in a ridiculous way.'} Then move the story on to a new situation and end with a "question" for the party, max 16 words, ending with "?".`;
      shape = `{"narration":"","question":"","hp":[],"recap":""}`;
    } else {
      task = `Narrate this round, 90-140 words, 2 paragraphs separated by blank lines. Then the foe strikes back at 1-2 standing party members, with a one-line taunt in dialogue. Return their damage in "hp" (from -1 to -${foe.boss ? (S.seats.length <= 2 ? 6 : 10) : (S.seats.length <= 2 ? 4 : 7)} each${S.seats.length === 1 ? '; hit the lone hero only every other round or so' : ''}). "question": a short prompt for the next round, max 12 words.`;
      shape = `{"narration":"","hp":[{"id":"","change":-4}],"question":"","recap":""}`;
    }
    const r = await ask(`${context()}

COMBAT ROUND ${G.round} vs ${foe.n} (AC ${foe.ac}). Foe HP went from ${G.foeBefore} to ${foe.hp} out of ${foe.mx}.
WHAT HAPPENED. Already rolled; narrate exactly these results:
${lines}

TASK: ${task} "recap": max 25 words.
JSON: ${shape}`);
    S.nar = narArr(r.narration); castMerge(r.cast); G.log.push(clip(r.recap, 200));

    applyHp(r.hp);

    }
    Sound.music('battle');
    setPhase('combat', 75);
  }

    await capsReady;

      const msg = {no_room:`There's no table called ${c}. Check the code on the TV.`, room_full:'That table is full.'}[e?.code] || "Couldn't reach the table. Check your connection and try again.";
      $('#app').innerHTML = `<div class="phone"><div class="panel card stack"><div class="ptitle">Can't join</div><p class="muted" style="margin:0">${esc(msg)}</p><button class="btn" id="backBtn">Back</button></div></div>`; $('#backBtn').onclick = titleScreen; return;

      const moves = ['Attack', ...c.moves, 'Something unhinged'];
      return wrap(`${foeBar}<div class="stack"><div class="pq">${esc(S.q)}</div>
        <div class="label">Your move</div><div class="chips">${moves.map(mv=>`<button class="chip" data-mv="${esc(mv)}" aria-pressed="${draft.mv===mv}">${esc(mv)}</button>`).join('')}</div>
        <label for="cbtIn" class="label">Describe it (optional)</label><textarea id="cbtIn" maxlength="140" placeholder="Kick it square in the crotch">${esc(draft.cbt||'')}</textarea>
        <div class="muted">Attack bonus ${sgn(m)} vs AC ${f.ac}</div>
        ${pt.insp?`<label class="row" style="gap:8px"><input type="checkbox" id="advChk" style="width:auto"> Spend Inspiration for advantage</label>`:''}</div>`,
        `<button class="btn big" id="cbtBtn">Roll to hit</button>`);
    }
    if (ph === 'clash') { return wrap(`<div class="panel card stack" style="text-align:center"><div class="label">This round</div><div id="pres" class="stack"></div><p class="muted">Watch the TV.</p></div>`); }
    if (ph === 'end') { const a = S.awards?.find(x=>x.id===me.id); return wrap(`<div class="panel card stack"><div class="label">${S.outcome==='win'?'You survived':'You died'}</div><div class="ptitle">${esc(a?.t||'Participation Trophy')}</div><p style="margin:0">${esc(a?.w||'')}</p><p class="muted" style="margin:0">Thanks for playing. The host can start a new game from the TV.</p></div>`); }
    return wrap('');
  }
  /* --- character creation --- */
  function cg(){ if (!draft.ch) draft.ch = me.ch ? {...me.ch} : {nm:'', rc:'Human', cl:'Fighter', lk:''}; return draft.ch; }
  function chargenView(){
    const ch = cg(), locked = mine('ch');
    if (locked) return wrap(`<div class="panel card stack"><div class="ptitle">${esc(me.ch.nm)} is ready</div><p class="muted" style="margin:0">${esc(me.ch.rc)} ${esc(me.ch.cl)}. Watch the TV for your rivals.</p><button class="btn ghost small" id="cgEdit">Edit character</button></div>`);
    const sh = sheet(ch);
    return wrap(`<div class="stack"><div class="ptitle">Forge your fool</div>
      <button class="btn ghost small" id="cgRand">Randomize everything</button>
      <label class="label" for="cgName">Character name</label><input id="cgName" maxlength="28" value="${esc(ch.nm)}" placeholder="Brock Thunderloins">
      <div class="label">Race</div><div class="chips">${Object.keys(RACES).map(r=>`<button class="chip" data-rc="${r}" aria-pressed="${ch.rc===r}">${r}</button>`).join('')}</div>
      <div class="muted" style="font-size:.9rem">${esc(RACES[ch.rc].t)}</div>
      <div class="label">Class</div><div class="classgrid">${Object.entries(CLASSES).map(([k,v])=>`<button class="chip" data-cl="${k}" aria-pressed="${ch.cl===k}">${k}<small>${esc(v.blurb)}</small></button>`).join('')}</div>
      <label class="label" for="cgLook">What do you look like?</label><textarea id="cgLook" maxlength="200" placeholder="A nervous halfling who carries too many spoons">${esc(ch.lk)}</textarea>
      <div class="slab" style="padding:12px" id="cgSheet">${sheetMini(ch)}</div></div>`,
      `<button class="btn" id="cgLock">Lock in</button>`);
  }
  function sheetMini(ch){ const sh = sheet(ch); return `<div class="row" style="justify-content:space-between"><b>${esc(ch.rc)} ${esc(ch.cl)}</b><span class="mono" style="font-size:1.2rem">HP ${sh.hp} &middot; AC ${sh.ac}</span></div>
      <div class="stats" style="margin:8px 0">${ABIL.map(a=>`<div><small>${a}</small><b>${sh.st[a]}</b><small>${sgn(amod(sh.st[a]))}</small></div>`).join('')}</div>
      <div class="kv">Skills: ${sh.cls.sk.map(k=>`<span>${esc(k)} <b>${sgn(checkMod(ch,k))}</b></span>`).join('')}</div><div class="kv" style="margin-top:4px">Moves: <b>${esc(sh.cls.moves.join(', '))}</b></div>`; }
  function animateMine(){
    if (S.ph === 'rolled') {
      const r = S.roll || {}, n = $('#pdieN'), d = $('#pdie'); let k = 0;
      Sound.fx('dice');
      const iv = setInterval(() => { if (!n) return clearInterval(iv); n.textContent = die(20); if (++k > 12) { clearInterval(iv); d.classList.remove('rolling'); n.textContent = r.d; $('#pres').innerHTML = `<div class="result ${r.res}" style="font-size:2.2rem">${resultText(r.res)}</div><div class="math" style="font-size:1.3rem">${r.d} ${sgn(r.m)} = ${r.tot} vs DC ${S.ck?.dc}</div>`; } }, 95);
    } else if (S.ph === 'clash') {
      const c = S.clash?.find(x=>x.id===me.id), el = $('#pres'); if (!el) return;
      if (!c) { el.innerHTML = '<div class="waiting">You sat this one out.</div>'; return; }
      el.innerHTML = c.idle ? '<div class="result fail" style="font-size:2rem">You froze up</div>' : c.save ? `<div class="result ${c.up?'success':'fail'}" style="font-size:2rem">${c.up?'Back on your feet!':'Still down'}</div><div class="math">death save ${c.d}</div>`
        : `<div class="result ${c.crit?'crit':c.hit?'success':c.d===1?'fumble':'fail'}" style="font-size:2.4rem">${c.crit?'CRITICAL HIT':c.hit?'Hit':c.d===1?'Fumble':'Miss'}</div><div class="math">${c.d} → ${c.tot} vs AC ${S.foe?.ac}${c.hit?` &middot; ${c.dmg} damage`:''}</div>`;
    }
  }
  function rollDice(){ const adv = $('#advChk')?.checked; return adv ? [die(20), die(20)] : [die(20)]; }
  function wire(){
    $('#mlSend') && ($('#mlSend').onclick = () => {
      const qs = S.ml?.[me.id] || []; me.ml = qs.map((_,j) => clip($('#ml'+j)?.value, 60));
      if (me.ml.some(a=>!a)) return toast('Fill in every prompt');
      store.set('rfs-player', me); send({ml: me.ml}); submit('ml');
    });
    $('#mlEdit') && ($('#mlEdit').onclick = () => { me.inp = null; send({inp:null}); render(true); });
    // chargen
    const ch = S.ph === 'chargen' ? cg() : null;
    const refresh = () => { const el = $('#cgSheet'); if (el) el.innerHTML = sheetMini(ch); };
    $$('[data-rc]').forEach(b => b.onclick = () => { ch.rc = b.dataset.rc; ch.nm = $('#cgName').value; ch.lk = $('#cgLook').value; render(true); });
    $$('[data-cl]').forEach(b => b.onclick = () => { ch.cl = b.dataset.cl; ch.nm = $('#cgName').value; ch.lk = $('#cgLook').value; render(true); });
    $('#cgName') && ($('#cgName').oninput = e => ch.nm = e.target.value);
    $('#cgLook') && ($('#cgLook').oninput = e => ch.lk = e.target.value);
    $('#cgRand') && ($('#cgRand').onclick = () => { Object.assign(ch, {nm: pick(NAME_A)+' '+pick(NAME_B), rc: pick(Object.keys(RACES)), cl: pick(Object.keys(CLASSES)), lk: pick(LOOKS)}); Sound.fx('dice'); render(true); });
    $('#cgLock') && ($('#cgLock').onclick = () => {
      ch.nm = clip($('#cgName').value, 28) || pick(NAME_A)+' '+pick(NAME_B); ch.lk = clip($('#cgLook').value, 200) || pick(LOOKS);
      me.ch = {...ch}; store.set('rfs-player', me); send({ch: me.ch}); submit('ch');
    });
    $('#cgEdit') && ($('#cgEdit').onclick = () => { me.inp = null; draft.ch = {...me.ch}; send({inp:null}); render(true); });
    $$('[data-fw]').forEach(b => b.onclick = () => submit('fw', {v:b.dataset.fw}));
    $$('[data-vote]').forEach(b => b.onclick = () => submit('vote', {v:parseInt(b.dataset.vote)}));
    const pi = $('#pitchIn');
    if (pi) { let dt; const upd = () => { draft.pitch = pi.value; $('#pitchCount').textContent = pi.value.length + '/200'; clearTimeout(dt); dt = setTimeout(() => send({draft:{pid:S.pid, v:pi.value.slice(0,200)}}), 500); }; pi.oninput = upd; upd(); }
    $('#pitchSend') && ($('#pitchSend').onclick = () => { const v = clip(pi.value, 200); if (!v) return toast('Pitch something, coward'); draft.pitch = ''; submit('pitch', {v}); });
    $('#pitchEdit') && ($('#pitchEdit').onclick = () => { draft.pitch = me.inp?.v || ''; me.inp = null; send({inp:null}); render(true); });
    $('#rollBtn') && ($('#rollBtn').onclick = () => { Sound.fx('dice'); submit('roll', {d: rollDice()}); });
    $$('[data-mv]').forEach(b => b.onclick = () => { draft.mv = b.dataset.mv; draft.cbt = $('#cbtIn').value; render(true); });
    $('#cbtIn') && ($('#cbtIn').oninput = e => draft.cbt = e.target.value);
    $('#cbtBtn') && ($('#cbtBtn').onclick = () => { const t = clip(((draft.mv||'Attack') + ': ' + ($('#cbtIn').value||'')).replace(/:\s*$/,''), 140); draft.cbt=''; Sound.fx('dice'); submit('cbt', {t, d: rollDice()}); });
    $('#saveBtn') && ($('#saveBtn').onclick = () => { Sound.fx('dice'); submit('cbt', {t:'death save', d:[die(20)]}); });
  }
  return { start };
})();

titleScreen();
</script>
</body>
</html>
